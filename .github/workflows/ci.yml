name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  # Desktop/model smoke tools need an interactive session or downloaded weights.
  # Unit tests exercise the contracts without altering the runner's clipboard.
  COTABBY_CLIPBOARD_TEST: '0'

jobs:
  windows:
    name: Windows x64 build and unit tests
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Restore solution
        run: dotnet restore Cotabby.sln
      - name: Compile all projects
        run: dotnet build Cotabby.sln --configuration Release --no-restore
      - name: Test portable core and parity fixtures
        run: dotnet test tests/Cotabby.Core.Tests/Cotabby.Core.Tests.csproj --configuration Release --no-build --no-restore
      - name: Test inference transport and Windows adapters
        run: dotnet test tests/Cotabby.Inference.Tests/Cotabby.Inference.Tests.csproj --configuration Release --no-build --no-restore --filter 'FullyQualifiedName!~ClipboardTextReaderTests'
      - name: Test portable app settings and task ownership
        run: dotnet test tests/Cotabby.App.Tests/Cotabby.App.Tests.csproj --configuration Release --no-build --no-restore
      - name: Test compiled WPF learning views on an isolated STA dispatcher
        run: dotnet test tests/Cotabby.App.Wpf.Tests/Cotabby.App.Wpf.Tests.csproj --configuration Release --no-build --no-restore --blame-hang-timeout 2m

  portable-core:
    name: Portable core and Swift parity on macOS x64
    # The pinned Swift policies use Swift 6.2 syntax supplied by Xcode 26.
    # ARM64 hosted capacity repeatedly failed before acquiring a runner. This standard Intel
    # image has the same macOS/Xcode generation; these are portable/source checks, not GPU tests.
    runs-on: macos-26-intel
    # Each verifier compiles actual pinned Swift declarations in an isolated temporary binary.
    # A 40-verifier run exhausted 35m on a slow hosted runner; the 41-verifier sibling passed
    # in 22m24s. Leave capacity for the full source suite without weakening case assertions.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Test portable core and parity fixtures
        run: dotnet test tests/Cotabby.Core.Tests/Cotabby.Core.Tests.csproj --configuration Release
      - name: Test portable app settings and task ownership
        run: dotnet test tests/Cotabby.App.Tests/Cotabby.App.Tests.csproj --configuration Release
      - name: Read the pinned macOS reference
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: ichthyoplanktonzyh/lingrove
          ref: 43ba08833a4b373b9b82bd4b4fc168ee18c3cd6f
          path: .mac-baseline
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            Cotabby/Support
            Packages/LingroveGraphLayout
            Cotabby/Models/Context
            Cotabby/Models/LanguageLearning
            Cotabby/Models/Vocabulary
            Cotabby/UI/Settings/Panes/LearningReviewSettingsSection.swift
            Cotabby/Models/Review
            Cotabby/Models/Runtime
            Cotabby/Models/Speech/SpeechAudioChunk.swift
            Cotabby/Models/Speech/LearningSpeechModels.swift
            Cotabby/Models/Speech/SpeechExportModels.swift
            Cotabby/Services/Speech/SpeechExportBuffer.swift
            Cotabby/Services/Speech/SystemSpeechAudioExporter.swift
            Cotabby/Services/Review/AnkiConnectClient.swift
            Cotabby/Services/Review/AnkiReviewController.swift
            Cotabby/Services/Review/AnkiReviewController+Navigation.swift
            Cotabby/Services/LanguageLearning/LearningEndpointSession.swift
            CotabbyTests/Services/Vocabulary/VocabularyContentTests.swift
            CotabbyTests/Support/Review/ReviewCardPolicyTests.swift
            CotabbyTests/Support/Speech/SpeechTextPolicyTests.swift
            Cotabby/Services/Vocabulary/VocabularyArchive.swift
            Cotabby/Services/Vocabulary/VocabularyGraphLayoutWorker.swift
            Cotabby/Services/Vocabulary/VocabularyArchive+ReviewCards.swift
            Cotabby/Services/Vocabulary/VocabularyArchive+Media.swift
            Cotabby/Services/Vocabulary/VocabularyArchive+Export.swift
            Cotabby/Services/Vocabulary/VocabularyImageStorage.swift
            Cotabby/Services/Vocabulary/VocabularyStore.swift
            Cotabby/Services/Vocabulary/VocabularyExportSession.swift
            Cotabby/Services/Vocabulary/VocabularyNotebookSession.swift
            Cotabby/Services/Vocabulary/VocabularySQLiteConnection.swift
            Cotabby/Services/Vocabulary/VocabularySQLiteDatabase.swift
            Cotabby/Services/Vocabulary/VocabularySQLiteFileLock.swift
            Cotabby/UI/Vocabulary/VocabularyNotebookView.swift
            Cotabby/UI/Vocabulary/VocabularyGraphPresentation.swift
            Cotabby/UI/Vocabulary/VocabularyEntryEditor.swift
            Cotabby/UI/Vocabulary/VocabularyContentEditor.swift
            Cotabby/Services/LanguageLearning
            Cotabby/Resources/learning-expressions.json
            Cotabby/Resources/learning-expressions.NOTICE.md
            Cotabby/Resources/learning-expressions.provenance.json
          persist-credentials: false
      - name: Verify the same corpus against committed Swift policies
        run: python3 scripts/verify-macos-parity.py --mac-repo .mac-baseline
      - name: Verify learning corpus against committed Mac contracts
        run: python3 scripts/verify-learning-macos-parity.py --mac-repo .mac-baseline
      - name: Verify local learning templates against committed Mac policies
        run: python3 scripts/verify-learning-local-macos-parity.py --mac-repo .mac-baseline
      - name: Verify lexical recognition against committed Mac policies
        run: python3 scripts/verify-learning-lexical-macos-parity.py --mac-repo .mac-baseline
      - name: Verify explanation input, prompt and parsing against committed Mac policies
        run: python3 scripts/verify-learning-explanation-macos-parity.py --mac-repo .mac-baseline
      - name: Verify writing capture to explanation input against committed Mac composition
        run: python3 scripts/verify-learning-capture-macos-parity.py --mac-repo .mac-baseline
      - name: Verify sense content values and HTML against committed Mac policies
        run: python3 scripts/verify-vocabulary-content-macos-parity.py --mac-repo .mac-baseline
      - name: Verify vocabulary capture identity and validation against committed Mac policies
        run: python3 scripts/verify-vocabulary-capture-macos-parity.py --mac-repo .mac-baseline
      - name: Verify notebook and review models against committed Mac values
        run: python3 scripts/verify-vocabulary-models-macos-parity.py --mac-repo .mac-baseline
      - name: Verify vocabulary save and sense mutations against committed Mac policies
        run: python3 scripts/verify-vocabulary-sense-macos-parity.py --mac-repo .mac-baseline
      - name: Verify notebook graph admission against committed Mac archive methods
        run: python3 scripts/verify-vocabulary-validation-macos-parity.py --mac-repo .mac-baseline
      - name: Verify concurrent sense editing and commit pruning against original Mac helpers
        run: python3 scripts/verify-vocabulary-edit-macos-parity.py --mac-repo .mac-baseline
      - name: Verify typed relational projection against committed Mac methods
        run: python3 scripts/verify-vocabulary-projection-macos-parity.py --mac-repo .mac-baseline
      - name: Verify row JSON against actual committed Mac Codable methods
        run: python3 scripts/verify-vocabulary-codec-macos-parity.py --mac-repo .mac-baseline
      - name: Verify transactions against original Mac SQLite classes
        run: python3 scripts/verify-vocabulary-sqlite-macos-parity.py --mac-repo .mac-baseline
      - name: Verify archive ownership against the complete original Mac actor
        run: python3 scripts/verify-vocabulary-archive-macos-parity.py --mac-repo .mac-baseline
      - name: Verify UI store publication against original Mac methods
        run: python3 scripts/verify-vocabulary-store-macos-parity.py --mac-repo .mac-baseline
      - name: Verify full writing captures against original Mac factory
        run: python3 scripts/verify-vocabulary-card-capture-macos-parity.py --mac-repo .mac-baseline
      - name: Verify notebook browser against original Mac view and policies
