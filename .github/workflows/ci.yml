      - name: Verify row JSON against actual committed Mac Codable methods
        run: python3 scripts/verify-vocabulary-codec-macos-parity.py --mac-repo .mac-baseline
      - name: Verify transactions against original Mac SQLite classes
        run: python3 scripts/verify-vocabulary-sqlite-macos-parity.py --mac-repo .mac-baseline
      - name: Verify archive ownership against the complete original Mac actor
