name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  # Desktop/model smoke tools need an interactive session or downloaded weights.
  # Unit tests exercise the contracts without altering the runner's clipboard.
  COTABBY_CLIPBOARD_TEST: '0'

jobs:
  windows:
    name: Windows x64 build and unit tests
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Restore solution
        run: dotnet restore Cotabby.sln
      - name: Check the Windows development environment without changing it
        run: ./scripts/check-windows-dev.ps1 -Json
      - name: Compile all projects
        run: dotnet build Cotabby.sln --configuration Release --no-restore
      - name: Test portable core and parity fixtures
        run: dotnet test tests/Cotabby.Core.Tests/Cotabby.Core.Tests.csproj --configuration Release --no-build --no-restore
      - name: Test inference transport and Windows adapters
        run: dotnet test tests/Cotabby.Inference.Tests/Cotabby.Inference.Tests.csproj --configuration Release --no-build --no-restore --filter 'FullyQualifiedName!~ClipboardTextReaderTests'
      - name: Test portable app settings and task ownership
        run: dotnet test tests/Cotabby.App.Tests/Cotabby.App.Tests.csproj --configuration Release --no-build --no-restore
      - name: Test compiled WPF learning views on an isolated STA dispatcher
        run: dotnet test tests/Cotabby.App.Wpf.Tests/Cotabby.App.Wpf.Tests.csproj --configuration Release --no-build --no-restore --blame-hang-timeout 2m

  portable-core:
    name: Portable core and Swift parity on macOS x64
    # The pinned Swift policies use Swift 6.2 syntax supplied by Xcode 26.
    # ARM64 hosted capacity repeatedly failed before acquiring a runner. This standard Intel
    # image has the same macOS/Xcode generation; these are portable/source checks, not GPU tests.
    runs-on: macos-26-intel
    # Each verifier compiles actual pinned Swift declarations in an isolated temporary binary.
    # A 51-verifier run reached the 50m limit on a slow hosted runner; its 52/53-verifier
    # siblings completed. Keep the full source suite and allow for hosted-runner variance.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Test portable core and parity fixtures
        run: dotnet test tests/Cotabby.Core.Tests/Cotabby.Core.Tests.csproj --configuration Release
      - name: Test portable app settings and task ownership
        run: dotnet test tests/Cotabby.App.Tests/Cotabby.App.Tests.csproj --configuration Release
      - name: Read the pinned macOS reference
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: ichthyoplanktonzyh/lingrove
          ref: 43ba08833a4b373b9b82bd4b4fc168ee18c3cd6f
          path: .mac-baseline
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            native/tts
            patches/llama-tts-streaming.patch
