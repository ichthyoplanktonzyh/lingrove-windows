name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  # Desktop/model smoke tools need an interactive session or downloaded weights.
  # Unit tests exercise the contracts without altering the runner's clipboard.
  COTABBY_CLIPBOARD_TEST: '0'

# Routine CI validates source and tests; no packaging, artifact upload or release.
jobs:
  windows:
    name: Windows x64 build and unit tests
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Restore solution
        run: dotnet restore Cotabby.sln
      - name: Check the Windows development environment without changing it
        run: ./scripts/check-windows-dev.ps1 -Json
      - name: Compile all projects
        run: dotnet build Cotabby.sln --configuration Release --no-restore
      - name: Test portable core and parity fixtures
        run: dotnet test tests/Cotabby.Core.Tests/Cotabby.Core.Tests.csproj --configuration Release --no-build --no-restore
      - name: Test inference transport and Windows adapters
        run: dotnet test tests/Cotabby.Inference.Tests/Cotabby.Inference.Tests.csproj --configuration Release --no-build --no-restore --filter 'FullyQualifiedName!~ClipboardTextReaderTests'
      - name: Test portable app settings and task ownership
        run: dotnet test tests/Cotabby.App.Tests/Cotabby.App.Tests.csproj --configuration Release --no-build --no-restore
      - name: Test compiled WPF learning views on an isolated STA dispatcher
        run: dotnet test tests/Cotabby.App.Wpf.Tests/Cotabby.App.Wpf.Tests.csproj --configuration Release --no-build --no-restore --blame-hang-timeout 2m

  portable-core:
    name: Portable core and Swift parity on macOS x64
    # The pinned Swift policies use Swift 6.2 syntax supplied by Xcode 26.
    # ARM64 hosted capacity repeatedly failed before acquiring a runner. This standard Intel
    # image has the same macOS/Xcode generation; these are portable/source checks, not GPU tests.
    runs-on: macos-26-intel
    # Each verifier compiles actual pinned Swift declarations in an isolated temporary binary.
    # A 51-verifier run reached the 50m limit on a slow hosted runner; its 52/53-verifier
    # siblings completed. Keep the full source suite and allow for hosted-runner variance.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Test portable core and parity fixtures
        run: dotnet test tests/Cotabby.Core.Tests/Cotabby.Core.Tests.csproj --configuration Release
      - name: Test portable app settings and task ownership
        run: dotnet test tests/Cotabby.App.Tests/Cotabby.App.Tests.csproj --configuration Release
      - name: Compile Windows solution with targeting enabled on macOS
        run: dotnet build Cotabby.sln --configuration Release -p:EnableWindowsTargeting=true
      - name: Read the pinned macOS reference
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: ichthyoplanktonzyh/lingrove
          ref: 43ba08833a4b373b9b82bd4b4fc168ee18c3cd6f
          path: .mac-baseline
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            native/tts
            patches/llama-tts-streaming.patch
            Cotabby/Support
            Packages/LingroveGraphLayout
            Cotabby/Models/Context
            Cotabby/Models/LanguageLearning
            Cotabby/Models/Vocabulary
            Cotabby/UI/Settings/Panes/LearningReviewSettingsSection.swift
            Cotabby/Models/Review
            Cotabby/Models/Runtime
            Cotabby/Models/Speech/SpeechAudioChunk.swift
            Cotabby/Models/Speech/LearningSpeechModels.swift
            Cotabby/Models/Speech/SpeechExportModels.swift
            Cotabby/Models/Speech/LearningSpeechSettings.swift
            Cotabby/Models/Speech/SpeechGenerationProfile.swift
            Cotabby/Models/Speech/SpeechRuntimeModels.swift
            Cotabby/Services/Speech/SpeechTelemetry.swift
            Cotabby/Services/Speech/LocalSpeechRuntime.swift
            CotabbyTests/Services/Speech/LocalSpeechRuntimeTests.swift
            Cotabby/Models/Runtime/Parameters/ModelSamplingValues.swift
            Cotabby/Services/Speech/SpeechEndpointClient.swift
            CotabbyTests/Services/Speech/SpeechEndpointClientTests.swift
            Cotabby/Services/Speech/LearningSpeechController.swift
            Cotabby/Services/Speech/LearningSpeechController+Export.swift
            Cotabby/Services/Speech/SpeechAudioPlayer.swift
            Cotabby/Services/Speech/SpeechAudioGenerator.swift
            Cotabby/Models/Speech/SpeechModelCatalog.swift
            Cotabby/Services/ModelManagement/ModelDownloadManager.swift
            CotabbyTests/Services/Speech/LearningSpeechControllerTests.swift
            CotabbyTests/Services/Speech/GeneratedSpeechControllerTests.swift
            Cotabby/Services/Speech/SpeechPCMPlayer.swift
            Cotabby/Services/Speech/SpeechPCMRenderer.swift
            CotabbyTests/Services/Speech/SpeechPCMPlayerTests.swift
            Cotabby/Services/Runtime/OpenAICompatible/OpenAICompatibleCredentialStore.swift
            Cotabby/Services/Speech/SpeechExportBuffer.swift
            Cotabby/Services/Speech/SystemSpeechAudioExporter.swift
            Cotabby/Services/Review/AnkiConnectClient.swift
            Cotabby/Services/Review/AnkiReviewController.swift
            Cotabby/Services/Review/AnkiReviewController+Navigation.swift
            Cotabby/Services/Review/ReviewAudioPreparation.swift
            Cotabby/Services/Review/AnkiReviewSession.swift
            Cotabby/Services/Review/AnkiReviewSession+Images.swift
            Cotabby/Services/Review/AnkiReviewBatchSession.swift
            CotabbyTests/Services/Review/AnkiReviewTests.swift
            Cotabby/Services/LanguageLearning/LearningEndpointSession.swift
            CotabbyTests/Services/Vocabulary/VocabularyContentTests.swift
            CotabbyTests/Support/Review/ReviewCardPolicyTests.swift
            CotabbyTests/Support/Speech/SpeechTextPolicyTests.swift
            CotabbyTests/Support/Speech/SpeechVoicePolicyTests.swift
            Cotabby/Services/Vocabulary/VocabularyArchive.swift
            Cotabby/Services/Vocabulary/VocabularyGraphLayoutWorker.swift
            Cotabby/Services/Vocabulary/VocabularyArchive+ReviewCards.swift
            Cotabby/Services/Vocabulary/VocabularyArchive+Media.swift
            Cotabby/Services/Vocabulary/VocabularyArchive+Export.swift
            Cotabby/Services/Vocabulary/VocabularyImageStorage.swift
            Cotabby/Services/Vocabulary/VocabularyStore.swift
            Cotabby/Services/Vocabulary/VocabularyExportSession.swift
            Cotabby/Services/Vocabulary/VocabularyNotebookSession.swift
            Cotabby/Services/Vocabulary/VocabularySQLiteConnection.swift
            Cotabby/Services/Vocabulary/VocabularySQLiteDatabase.swift
            Cotabby/Services/Vocabulary/VocabularySQLiteFileLock.swift
            Cotabby/UI/Vocabulary/VocabularyNotebookView.swift
            Cotabby/UI/Vocabulary/VocabularyGraphPresentation.swift
            Cotabby/UI/Vocabulary/VocabularyEntryEditor.swift
            Cotabby/UI/Vocabulary/VocabularyContentEditor.swift
            Cotabby/Services/LanguageLearning
            Cotabby/Resources/learning-expressions.json
            Cotabby/Resources/learning-expressions.NOTICE.md
            Cotabby/Resources/learning-expressions.provenance.json
          persist-credentials: false

      - name: Read the versioned editor module reference
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: ichthyoplanktonzyh/lingrove
          ref: cc468b89f5c360cc7210fac4f1a8b52197870bf2
          path: .mac-current-editor
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            Cotabby/Support
            Cotabby/Models/Context
            Cotabby/Models/LanguageLearning
            Cotabby/Models/Vocabulary
            Cotabby/Models/Review
            Cotabby/UI/Vocabulary/VocabularyEntryEditor.swift
            CotabbyTests/Support/Vocabulary/VocabularyPolicyTests.swift
      - name: Test bounded parity scheduling and complete command manifest
        run: python3 -m unittest discover -s scripts/tests -p test_parity_scheduler.py
      - name: Verify all historical source contracts with two bounded workers
        run: python3 scripts/run_macos_parity_suite.py --jobs 2

  frozen-vocabulary:
    name: Frozen vocabulary document and SQLite Swift probes
    runs-on: macos-26-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Read the latest committed CLI reference
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: ichthyoplanktonzyh/lingrove
          ref: 3b53402f2cbc196b0398d133177fd80006d165b2
          path: .mac-cli-3b
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            Lingrove/Models/CLI/CLIProtocol.swift
            Lingrove/Models/CLI/CLICaptureModels.swift
            Lingrove/Support/Vocabulary/VocabularyCLIPlan.swift
      - name: Compare CLI fingerprint, stable IDs and ranges with 3b Swift
        run: python3 scripts/verify-cli-3b-macos-parity.py --mac-repo .mac-cli-3b
      - name: Read the frozen vocabulary reference independently of historical fixtures
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: ichthyoplanktonzyh/lingrove
          ref: 35b7fbe5c788c5524936ade1dfb7c89a3a285b04
          path: .mac-frozen-vocabulary
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            Lingrove/Models/Vocabulary/VocabularyDatabaseModels.swift
            Lingrove/Models/Vocabulary/VocabularyCLIReceipt.swift
            Lingrove/Models/Context/LanguageCatalog.swift
            Lingrove/Models/LanguageLearning/LearningLanguage.swift
            Lingrove/Models/LanguageLearning/LearningExplanationModels.swift
            Lingrove/Models/Vocabulary/VocabularyModels.swift
            Lingrove/Models/Vocabulary/VocabularyLifecycleModels.swift
            Lingrove/Models/Vocabulary/VocabularySemanticModels.swift
            Lingrove/Models/Vocabulary/VocabularyClassificationModels.swift
            Lingrove/Models/Vocabulary/VocabularyContentModels.swift
            Lingrove/Models/Review/ReviewModels.swift
            Lingrove/Models/Review/ReviewLayout.swift
            Lingrove/Models/Review/ReviewAudioModels.swift
            Lingrove/Support/Vocabulary/VocabularyNotebookProjection.swift
            Lingrove/Support/Vocabulary/VocabularyPolicy.swift
            Lingrove/Support/Vocabulary/VocabularyDatabaseProjection.swift
            Lingrove/Support/Vocabulary/VocabularySemanticDatabaseProjection.swift
            Lingrove/Support/Vocabulary/VocabularyClassificationRows.swift
            Lingrove/Support/Vocabulary/VocabularyLifecyclePolicy.swift
            Lingrove/Support/Vocabulary/VocabularySemanticPolicy.swift
            Lingrove/Support/Vocabulary/VocabularyClassificationPolicy.swift
            Lingrove/Support/Vocabulary/VocabularyMeaningLabelPolicy.swift
            Lingrove/Support/Suggestion/Acceptance/InsertionSafetyGate.swift
            Lingrove/Support/LanguageLearning/LearningExplanationPolicy.swift
            Lingrove/Support/Prompting/ModelContextBudget.swift
            Lingrove/Services/Vocabulary/VocabularySQLiteConnection.swift
            Lingrove/Services/Vocabulary/VocabularySQLiteFileLock.swift
            Lingrove/Services/Vocabulary/VocabularySQLiteDatabase.swift
            Lingrove/Services/Vocabulary/VocabularySQLiteMeaningSchema.swift
            Lingrove/Services/Vocabulary/VocabularySQLiteClassificationSchema.swift
      - name: Compare real frozen Swift SQLite schema and classification migration
        run: python3 scripts/verify-vocabulary-sqlite-frozen-macos-parity.py --mac-repo .mac-frozen-vocabulary
      - name: Compare the two UUID-only row payload contracts
        run: python3 scripts/verify-vocabulary-sqlite-frozen-uuid-macos-parity.py --mac-repo .mac-frozen-vocabulary
      - name: Compare frozen portable documents and typed timestamp bit patterns
        run: python3 scripts/verify-vocabulary-document-frozen-macos-parity.py --mac-repo .mac-frozen-vocabulary
      - name: Compare frozen relational rows and populated named SQLite reopen
        run: python3 scripts/verify-vocabulary-relational-frozen-macos-parity.py --mac-repo .mac-frozen-vocabulary

  speech-native-windows:
    name: Windows x64 isolated native speech helper
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Prepare exact independent speech source and reviewed streaming patch
        run: python scripts/prepare-speech-runtime.py
      - name: Verify dependency preparation preserves unknown local input
        run: python scripts/test-speech-runtime-preparation.py --source-dir build/speech-native/llama.cpp
      - name: Configure static CPU speech helper independently of LLamaSharp
        run: cmake -S native/tts -B build/speech-native/cmake -G "Visual Studio 17 2022" -A x64 -DLLAMA_SOURCE_DIR="${{ github.workspace }}/build/speech-native/llama.cpp"
      - name: Check actual Visual Studio unity membership and object metadata
        run: python scripts/check-speech-vs-project.py --build-dir build/speech-native/cmake --source-dir build/speech-native/llama.cpp
      - name: Compile actual helper and native platform checks without model weights
        run: cmake --build build/speech-native/cmake --config Release --target lingrove-tts-helper lingrove-tts-platform-check --parallel 2 -- /warnAsError:MSB8027
      - name: Check actual binary frames reference duration and abrupt parent exit
        run: python scripts/smoke-native-speech.py --helper build/speech-native/cmake/Release/lingrove-tts-helper.exe --platform build/speech-native/cmake/Release/lingrove-tts-platform-check.exe
